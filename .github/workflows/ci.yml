name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      MONGODB_USERNAME: ${{ secrets.MONGODB_USERNAME }}
      MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      CHROMA_HOST: ${{ secrets.CHROMA_HOST }}
      CHROMA_API_KEY: ${{ secrets.CHROMA_API_KEY }}
      CHROMA_TENANT: ${{ secrets.CHROMA_TENANT }}
      CHROMA_DATABASE: ${{ secrets.CHROMA_DATABASE }}
      POSTGRESQL_DATABASE: ${{ secrets.POSTGRESQL_DATABASE }}
      SYSTEM_PROMPT: ${{ secrets.SYSTEM_PROMPT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: phase5-production/requirements.txt

      # phase5-production/requirements.txt is the superset (it was bulk-installed
      # from phase4-agent's own requirements.txt), so it covers phase1/phase3/phase4
      # too. pytest-asyncio is pinned separately below because it's present in
      # phase4-agent/.venv (where the async agent tests actually run locally) but
      # missing from phase5-production/requirements.txt's pip freeze.
      - name: Install dependencies
        run: |
          pip install -r phase5-production/requirements.txt
          pip install pytest-asyncio==1.4.0

      - name: Run tests
        run: pytest phase1-llm-apis phase3-rag phase4-agent phase5-production -v

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t birthday-agent-api -f phase5-production/Dockerfile .
